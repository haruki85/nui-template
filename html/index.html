<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="base.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="app" class="app light hidden">
            <div id="drag" class="drag-handle" title="ドラッグで移動" aria-hidden="true"></div>
            <div class="resize-handle e" data-dir="e" aria-hidden="true"></div>
            <div class="resize-handle w" data-dir="w" aria-hidden="true"></div>
            <div class="resize-handle s" data-dir="s" aria-hidden="true"></div>
            <div class="resize-handle se" data-dir="se" aria-hidden="true"></div>
            <div class="resize-handle sw" data-dir="sw" aria-hidden="true"></div>
            <header>
                <button type="button" id="theme" class="ghost icon-button theme-toggle">
                    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
                    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7Z"></path></svg>
                </button>
                <button type="button" id="close" class="ghost icon-button" aria-label="閉じる" title="閉じる">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                </button>
            </header>
        </div>
        <script src="base.js"></script>
        <script src="script.js"></script>
    </body>
</html>
